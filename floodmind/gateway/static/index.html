<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FloodMind</title>
<style>
  :root {
    --bg: #0a0b0d;
    --bg-soft: #0e1012;
    --panel: #121417;
    --panel-hi: #171a1e;
    --line: #212428;
    --line-soft: #17191c;
    --text: #e8e9eb;
    --dim: #9b9ea6;
    --faint: #5d6067;
    --ok: #4cc38a;
    --err: #e5484d;
    --warn: #f5a524;
    --accent: #dfe1e5;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); font-size: 14px; display: flex; overflow: hidden; }
  ::selection { background: rgba(140,160,255,.25); }
  a { color: inherit; }

  /* ───────── 侧栏 ───────── */
  aside {
    width: 264px; min-width: 264px; background: var(--bg-soft);
    border-right: 1px solid var(--line-soft); display: flex; flex-direction: column;
  }
  .brand { padding: 16px 16px 10px; display: flex; align-items: baseline; gap: 8px; }
  .brand b { font-size: 15px; font-weight: 650; letter-spacing: .2px; }
  .brand span { font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: 1.2px; }
  .new-chat {
    margin: 4px 12px 8px; padding: 8px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); color: var(--dim); font-size: 13px;
    display: flex; align-items: center; gap: 8px; transition: all .12s;
  }
  .new-chat:hover { color: var(--text); border-color: #3a3e46; background: var(--panel); }
  .new-chat .plus { font-family: var(--mono); color: var(--faint); }
  .new-chat:hover .plus { color: var(--ok); }
  #search {
    margin: 0 12px 8px; padding: 7px 10px; background: transparent; border: 1px solid var(--line-soft);
    border-radius: 8px; color: var(--text); font-size: 12.5px; outline: none; width: calc(100% - 24px);
  }
  #search:focus { border-color: #34383f; }
  #search::placeholder { color: var(--faint); }
  #sessions { flex: 1; overflow-y: auto; padding: 2px 8px 12px; }
  .side-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--faint); padding: 10px 10px 6px; }
  .session {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px; margin: 1px 0;
    border-radius: 8px; cursor: pointer; color: var(--dim); font-size: 13px; border: 1px solid transparent;
  }
  .session:hover { background: var(--panel); color: var(--text); }
  .session.active { background: var(--panel-hi); color: var(--text); border-color: var(--line); }
  .session .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session .when { font-size: 10.5px; color: var(--faint); }
  .session .del { opacity: 0; color: var(--faint); font-size: 13px; padding: 0 3px; border-radius: 4px; }
  .session:hover .del { opacity: 1; }
  .session .del:hover { color: var(--err); }
  .side-foot {
    border-top: 1px solid var(--line-soft); padding: 10px 16px; font-size: 11px; color: var(--faint);
    display: flex; justify-content: space-between; font-family: var(--mono);
  }

  /* ───────── 主区 ───────── */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  header {
    display: flex; align-items: center; gap: 12px; padding: 0 20px; height: 52px;
    border-bottom: 1px solid var(--line-soft); background: var(--bg);
  }
  header .title { font-size: 13px; color: var(--dim); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.running { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
  .dot.err { background: var(--err); }
  @keyframes pulse { 50% { opacity: .35; } }
  #status { font-size: 11.5px; color: var(--faint); font-family: var(--mono); }
  header .tok { font-size: 11px; color: var(--faint); font-family: var(--mono); }

  #scroller { flex: 1; overflow-y: auto; scroll-behavior: auto; }
  #chat { max-width: 780px; margin: 0 auto; padding: 28px 28px 30vh; }
  #jump {
    position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%);
    display: none; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--line);
    background: var(--panel-hi); color: var(--dim); font-size: 12px; cursor: pointer; z-index: 5;
  }
  #jump:hover { color: var(--text); }

  /* 消息块（Codex 风格：扁平无气泡） */
  .turn { padding: 16px 0 4px; }
  .turn + .turn { border-top: 1px solid var(--line-soft); margin-top: 14px; }
  .role { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--faint); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .role .r-err { color: var(--err); }
  .body { line-height: 1.75; word-break: break-word; color: var(--text); }
  .turn.user .body { color: #c9cbd1; }
  .body p { margin: 7px 0; } .body p:first-child { margin-top: 0; } .body p:last-child { margin-bottom: 0; }
  .body h1,.body h2,.body h3,.body h4 { margin: 14px 0 6px; font-size: 15px; font-weight: 650; }
  .body ul,.body ol { margin: 6px 0 6px 22px; } .body li { margin: 3px 0; }
  .body blockquote { border-left: 2px solid var(--line); padding-left: 12px; color: var(--dim); margin: 8px 0; }
  .body table { border-collapse: collapse; margin: 10px 0; font-size: 13px; }
  .body th,.body td { border: 1px solid var(--line); padding: 5px 12px; text-align: left; }
  .body th { color: var(--dim); font-weight: 600; background: var(--bg-soft); }
  .body code { font-family: var(--mono); font-size: 12.5px; background: var(--panel); border: 1px solid var(--line-soft); border-radius: 5px; padding: 1px 5px; }
  .codeblock { position: relative; margin: 10px 0; border: 1px solid var(--line-soft); border-radius: 10px; background: var(--bg-soft); }
  .codeblock .cb-head {
    display: flex; justify-content: space-between; align-items: center; padding: 6px 12px;
    border-bottom: 1px solid var(--line-soft); font-family: var(--mono); font-size: 10.5px; color: var(--faint);
  }
  .codeblock .cb-copy { cursor: pointer; color: var(--faint); font-size: 11px; }
  .codeblock .cb-copy:hover { color: var(--text); }
  .codeblock pre { padding: 12px 14px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; }
  .codeblock pre code { background: none; border: none; padding: 0; font-size: inherit; }
  .caret { display: inline-block; width: 7px; height: 15px; background: var(--text); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* 思考块 */
  .think { margin: 6px 0; border-left: 2px solid var(--line); padding: 2px 0 2px 12px; }
  .think > .t-head { display: flex; align-items: center; gap: 7px; cursor: pointer; color: var(--faint); font-size: 12px; user-select: none; }
  .think > .t-head:hover { color: var(--dim); }
  .think .chev { font-family: var(--mono); font-size: 10px; transition: transform .15s; }
  .think.open .chev { transform: rotate(90deg); }
  .think .t-body { display: none; color: var(--faint); font-size: 12.5px; line-height: 1.7; white-space: pre-wrap; margin-top: 6px; max-height: 300px; overflow-y: auto; }
  .think.open .t-body { display: block; }

  /* 工具调用行 */
  .tool { margin: 5px 0; border: 1px solid var(--line-soft); border-radius: 8px; background: var(--bg-soft); overflow: hidden; }
  .tool .t-head {
    display: flex; align-items: center; gap: 9px; padding: 7px 12px; cursor: pointer;
    font-family: var(--mono); font-size: 12px; color: var(--dim); user-select: none;
  }
  .tool .t-head:hover { background: var(--panel); }
  .tool .chev { font-size: 10px; color: var(--faint); transition: transform .15s; }
  .tool.open .chev { transform: rotate(90deg); }
  .tool .t-name { color: var(--text); }
  .tool .st { display: flex; align-items: center; gap: 5px; font-size: 11px; }
  .tool .st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
  .tool .st.completed::before { background: var(--ok); }
  .tool .st.error::before { background: var(--err); }
  .tool .dur { margin-left: auto; font-size: 10.5px; color: var(--faint); }
  .tool .t-detail { display: none; border-top: 1px solid var(--line-soft); padding: 9px 12px; }
  .tool.open .t-detail { display: block; }
  .tool .t-detail .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--faint); margin: 6px 0 3px; }
  .tool .t-detail pre {
    font-family: var(--mono); font-size: 11.5px; line-height: 1.6; color: var(--dim);
    white-space: pre-wrap; word-break: break-all; max-height: 240px; overflow-y: auto;
  }

  /* 计划卡片 */
  .plan { margin: 8px 0; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--bg-soft); }
  .plan .p-title { font-size: 13px; font-weight: 600; margin-bottom: 7px; }
  .plan .p-step { display: flex; gap: 9px; align-items: baseline; padding: 3px 0; font-size: 13px; color: var(--dim); }
  .plan .p-step .glyph { font-family: var(--mono); color: var(--faint); width: 14px; flex: none; }
  .plan .p-step.done { color: var(--faint); text-decoration: line-through; }
  .plan .p-step.done .glyph { color: var(--ok); }
  .plan .p-step.doing .glyph { color: var(--warn); }

  /* 权限审批卡片 */
  .perm { margin: 10px 0; border: 1px solid rgba(245,165,36,.4); border-radius: 10px; background: rgba(245,165,36,.05); overflow: hidden; }
  .perm .p-head { display: flex; align-items: center; gap: 9px; padding: 9px 14px; font-size: 13px; }
  .perm .p-head .badge { font-family: var(--mono); font-size: 10px; letter-spacing: 1px; color: var(--warn); border: 1px solid rgba(245,165,36,.4); border-radius: 4px; padding: 1px 6px; }
  .perm .p-head .t { color: var(--text); font-weight: 600; }
  .perm .reason { padding: 0 14px 8px; color: var(--dim); font-size: 12.5px; }
  .perm pre {
    margin: 0 14px 10px; padding: 9px 12px; background: var(--bg); border: 1px solid var(--line-soft);
    border-radius: 8px; font-family: var(--mono); font-size: 12px; color: var(--dim);
    white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto;
  }
  .perm .p-actions { display: flex; gap: 8px; padding: 0 14px 12px; align-items: center; }
  .perm .resolved-mark { padding: 0 14px 12px; font-size: 12.5px; font-family: var(--mono); }
  .perm.resolved { opacity: .6; }
  kbd { font-family: var(--mono); font-size: 10px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--faint); }

  /* 产物卡片 */
  .artifact { display: inline-flex; align-items: center; gap: 9px; margin: 5px 6px 5px 0; padding: 7px 12px;
    border: 1px solid var(--line); border-radius: 9px; background: var(--bg-soft); font-size: 12.5px; color: var(--dim);
    text-decoration: none; cursor: pointer; }
  .artifact:hover { border-color: #3a3e46; color: var(--text); }
  .artifact .sz { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
  .artifact-img { display: block; max-width: 100%; max-height: 320px; border: 1px solid var(--line); border-radius: 10px; margin: 6px 0; cursor: zoom-in; }

  /* 错误块 */
  .errblk { margin: 8px 0; border: 1px solid rgba(229,72,77,.35); border-radius: 10px; padding: 10px 14px; background: rgba(229,72,77,.05); font-size: 13px; }
  .errblk .e-head { color: var(--err); font-weight: 600; font-size: 12px; letter-spacing: .5px; margin-bottom: 4px; }

  /* 步骤状态行 */
  .step-line { font-family: var(--mono); font-size: 11px; color: var(--faint); padding: 4px 0; }

  /* 空状态 */
  #empty { max-width: 640px; margin: 0 auto; padding: 120px 28px 0; text-align: center; }
  #empty .logo { font-size: 34px; font-weight: 700; letter-spacing: .5px; }
  #empty .sub { color: var(--faint); font-size: 13px; margin: 10px 0 34px; }
  #empty .sugs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; }
  .sug { border: 1px solid var(--line); border-radius: 12px; padding: 13px 16px; cursor: pointer; transition: all .12s; }
  .sug:hover { border-color: #3a3e46; background: var(--panel); }
  .sug .s-title { font-size: 13.5px; color: var(--text); margin-bottom: 3px; }
  .sug .s-desc { font-size: 12px; color: var(--faint); }

  /* 输入区 */
  .composer-wrap { position: absolute; bottom: 0; left: 0; right: 0; padding: 10px 0 16px;
    background: linear-gradient(transparent, var(--bg) 30%); pointer-events: none; }
  .composer-wrap > * { pointer-events: auto; }
  .composer {
    max-width: 780px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 12px 14px 9px; transition: border-color .15s;
  }
  .composer:focus-within { border-color: #3a3f47; }
  .composer textarea {
    width: 100%; background: transparent; border: none; outline: none; resize: none;
    color: var(--text); font: inherit; line-height: 1.6; max-height: 200px; display: block;
  }
  .composer textarea::placeholder { color: var(--faint); }
  .composer .c-foot { display: flex; align-items: center; margin-top: 8px; }
  .composer .hint { font-size: 11px; color: var(--faint); flex: 1; font-family: var(--mono); }
  #send {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel-hi);
    color: var(--dim); cursor: pointer; font-size: 13px; font-family: var(--mono); transition: all .12s;
  }
  #send:hover { color: var(--text); border-color: #3a3e46; }
  #send.stop { background: var(--err); border-color: var(--err); color: #fff; }

  /* 登录遮罩 */
  #gate { position: fixed; inset: 0; background: var(--bg); z-index: 50; display: none; place-items: center; }
  #gate .box { width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px; }
  #gate h1 { font-size: 16px; margin-bottom: 4px; }
  #gate p { font-size: 12.5px; color: var(--dim); margin-bottom: 16px; }
  #gate input { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--text); font: inherit; outline: none; margin-bottom: 12px; }
  #gate input:focus { border-color: #3a3f47; }
  #gate .btn { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-hi); color: var(--text); cursor: pointer; }
  #gate .err { color: var(--err); font-size: 12px; margin-top: 10px; min-height: 16px; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #1e2126; border-radius: 5px; border: 3px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #2a2e34; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<aside>
  <div class="brand"><b>FloodMind</b><span>gateway</span></div>
  <div class="new-chat" id="btn-new"><span class="plus">+</span> 新建会话</div>
  <input id="search" placeholder="过滤会话…" autocomplete="off">
  <div class="side-label">Sessions</div>
  <div id="sessions"></div>
  <div class="side-foot"><span id="sf-left">--</span><span id="sf-right"></span></div>
</aside>

<main>
  <header>
    <div class="dot" id="hd-dot"></div>
    <div class="title" id="cur-title">FloodMind</div>
    <div id="status">空闲</div>
    <div class="tok" id="tok"></div>
  </header>
  <div id="scroller">
    <div id="empty">
      <div class="logo">FloodMind</div>
      <div class="sub">本机办公智能体 · 可读写文件、执行命令、生成文档与图表</div>
      <div class="sugs">
        <div class="sug" data-p="分析当前工作区下所有 CSV 文件的结构和数据概况，输出一页摘要"><div class="s-title">分析工作区数据</div><div class="s-desc">读取 CSV/Excel 并给出概况摘要</div></div>
        <div class="sug" data-p="根据今天的日期生成一份本周工作周报 Excel，包含待办事项表"><div class="s-title">生成周报</div><div class="s-desc">产出 Excel 文档</div></div>
        <div class="sug" data-p="用 Python 画一条正弦曲线和一个余弦曲线的对比图，保存为 PNG"><div class="s-title">画图</div><div class="s-desc">matplotlib 出图并保存</div></div>
        <div class="sug" data-p="执行 echo gateway-ok > .floodmind/tmp_check.txt 并告诉我结果"><div class="s-title">执行命令</div><div class="s-desc">体验权限审批流程</div></div>
      </div>
    </div>
    <div id="chat"></div>
  </div>
  <button id="jump">回到底部 ↓</button>
  <div class="composer-wrap">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="给 FloodMind 派发任务…"></textarea>
      <div class="c-foot">
        <div class="hint">Enter 发送 · Shift+Enter 换行 · Esc 停止</div>
        <button id="send">↑</button>
      </div>
    </div>
  </div>
</main>

<div id="gate">
  <div class="box">
    <h1>连接 FloodMind Gateway</h1>
    <p>输入控制台打印的鉴权 token</p>
    <input id="gate-token" type="password" placeholder="fmgt-…" autocomplete="off">
    <button class="btn" id="gate-enter">连接</button>
    <div class="err" id="gate-err"></div>
  </div>
</div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const scroller = $("#scroller");

/* ═══════════ API ═══════════ */
const api = {
  token: localStorage.getItem("fm_token") || "",
  headers() {
    const h = { "Content-Type": "application/json" };
    if (this.token) h["Authorization"] = "Bearer " + this.token;
    return h;
  },
  async ok(resp) {
    if (resp.status === 401) { showGate("token 无效或已过期"); throw new Error("unauthorized"); }
    if (!resp.ok) throw new Error((await resp.text()).slice(0, 300));
    return resp.json();
  },
  get(p) { return fetch(p, { headers: this.headers() }).then(r => this.ok(r)); },
  post(p, body) { return fetch(p, { method: "POST", headers: this.headers(), body: JSON.stringify(body) }).then(r => this.ok(r)); },
  del(p) { return fetch(p, { method: "DELETE", headers: this.headers() }).then(r => this.ok(r)); },
};

/* ═══════════ Markdown 渲染 ═══════════ */
function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

let copySeq = 0;
function codeblock(code, lang) {
  const id = "cb" + (++copySeq);
  return `<div class="codeblock"><div class="cb-head"><span>${esc(lang || "code")}</span>` +
    `<span class="cb-copy" data-cb="${id}">复制</span></div>` +
    `<pre><code id="${id}">${esc(code)}</code></pre></div>`;
}

function md(src) {
  src = String(src ?? "");
  let out = "", inCode = false, codeBuf = "", codeLang = "";
  const inline = (h) => h
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  for (const line of src.split("\n")) {
    const fence = line.match(/^```\s*(\w*)/);
    if (fence) {
      if (inCode) { out += codeblock(codeBuf, codeLang); inCode = false; codeBuf = ""; }
      else { inCode = true; codeLang = fence[1]; }
      continue;
    }
    if (inCode) { codeBuf += line + "\n"; continue; }
    let h = esc(line);
    h = inline(h)
      .replace(/^#### (.*)/, "<h4>$1</h4>").replace(/^### (.*)/, "<h3>$1</h3>")
      .replace(/^## (.*)/, "<h2>$1</h2>").replace(/^# (.*)/, "<h1>$1</h1>")
      .replace(/^&gt; (.*)/, "<blockquote>$1</blockquote>")
      .replace(/^\s*[-*] (.*)/, "<li>$1</li>")
      .replace(/^\s*\d+\. (.*)/, "<li>$1</li>");
    if (/^<(h\d|li|blockquote)/.test(h)) out += h;
    else out += "<p>" + (h || "&nbsp;") + "</p>";
  }
  if (inCode) out += codeblock(codeBuf, codeLang);
  return out;
}

document.addEventListener("click", (e) => {
  const cb = e.target.closest(".cb-copy");
  if (cb) {
    const code = document.getElementById(cb.dataset.cb);
    navigator.clipboard.writeText(code.textContent).then(() => {
      cb.textContent = "已复制"; setTimeout(() => (cb.textContent = "复制"), 1200);
    });
  }
});

/* ═══════════ 会话管理 ═══════════ */
let allSessions = [], curSession = "", running = false, totalTok = 0;

function relTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const diff = (Date.now() - d.getTime()) / 1000;
  if (isNaN(diff)) return "";
  if (diff < 60) return "刚刚";
  if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
  if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
  return Math.floor(diff / 86400) + " 天前";
}

async function loadSessions() {
  const data = await api.get("/api/sessions");
  allSessions = data.sessions || [];
  renderSessions();
  $("#sf-left").textContent = `${allSessions.length} 会话`;
  $("#sf-right").textContent = "已连接";
}

function renderSessions() {
  const kw = ($("#search").value || "").trim().toLowerCase();
  const box = $("#sessions"); box.innerHTML = "";
  const list = allSessions
    .map(s => ({ ...s, sid: s.id || s.session_id }))
    .filter(s => s.sid && (!kw || (s.title || s.sid).toLowerCase().includes(kw)))
    .sort((a, b) => String(b.last_active || "").localeCompare(String(a.last_active || "")));
  for (const s of list) {
    const shownTitle = s.title && s.title !== "Untitled" ? s.title : s.sid;
    const item = document.createElement("div");
    item.className = "session" + (s.sid === curSession ? " active" : "");
    item.innerHTML = `<span class="t">${esc(shownTitle)}</span>` +
      `<span class="when">${esc(relTime(s.last_active))}</span><span class="del" title="删除会话">×</span>`;
    item.onclick = (e) => {
      if (e.target.classList.contains("del")) { delSession(s.sid); return; }
      switchSession(s.sid);
    };
    box.appendChild(item);
  }
  if (!list.length) box.innerHTML = `<div style="padding:14px 10px;color:var(--faint);font-size:12px">无会话</div>`;
}
$("#search").addEventListener("input", renderSessions);

async function delSession(id) {
  if (!confirm("删除会话 " + id + "？其历史记录将一并删除，不可恢复。")) return;
  await api.del("/api/sessions/" + encodeURIComponent(id));
  if (id === curSession) { curSession = ""; $("#chat").innerHTML = ""; $("#empty").style.display = ""; $("#cur-title").textContent = "FloodMind"; }
  loadSessions();
}

function hideEmpty() { $("#empty").style.display = "none"; }

async function switchSession(id) {
  curSession = id;
  hideEmpty();
  const info = allSessions.find(s => (s.id || s.session_id) === id);
  $("#cur-title").textContent = (info && info.title && info.title !== "Untitled") ? info.title : id;
  $("#chat").innerHTML = "";
  try {
    const data = await api.get("/api/sessions/" + encodeURIComponent(id) + "/messages");
    for (const m of data.messages) {
      const role = m.role === "user" ? "user" : "assistant";
      const turn = newTurn(role);
      turn.body.innerHTML = md(m.content || "");
    }
  } catch (e) { /* 新会话无历史 */ }
  loadSessions();
  scrollBottom(true);
}

async function newSession() {
  const id = "web-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  try { await api.post("/api/sessions", { session_id: id }); } catch (e) { /* 已存在也可用 */ }
  curSession = id;
  hideEmpty();
  $("#chat").innerHTML = "";
  $("#cur-title").textContent = id;
  loadSessions();
  $("#input").focus();
}

/* ═══════════ 消息构建 ═══════════ */
function newTurn(role) {
  const el = document.createElement("div");
  el.className = "turn " + role;
  el.innerHTML = `<div class="role">${role === "user" ? "You" : "FloodMind"}</div>` +
    `<div class="activity"></div><div class="body"></div>`;
  $("#chat").appendChild(el);
  return { el, activity: el.querySelector(".activity"), body: el.querySelector(".body") };
}

let stick = true;
scroller.addEventListener("scroll", () => {
  const nearBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 90;
  stick = nearBottom;
  $("#jump").style.display = nearBottom || !$("#chat").children.length ? "none" : "block";
});
$("#jump").onclick = () => scrollBottom(true);
function scrollBottom(force) {
  if (stick || force) scroller.scrollTop = scroller.scrollHeight;
}

function setStatus(text, cls) {
  $("#status").textContent = text;
  $("#hd-dot").className = "dot" + (cls ? " " + cls : "");
}

/* ═══════════ 思考块 ═══════════ */
function makeThink(container) {
  const el = document.createElement("div");
  el.className = "think open";
  el.innerHTML = `<div class="t-head"><span class="chev">▸</span><span>Thinking</span></div><div class="t-body"></div>`;
  el.querySelector(".t-head").onclick = () => el.classList.toggle("open");
  container.appendChild(el);
  return {
    push(text) { el.querySelector(".t-body").textContent += text; scrollBottom(); },
    collapse() { el.classList.remove("open"); },
  };
}

/* ═══════════ 工具行 ═══════════ */
function makeTool(container, name) {
  const t0 = performance.now();
  const el = document.createElement("div");
  el.className = "tool";
  el.innerHTML = `<div class="t-head"><span class="chev">▸</span><span class="t-name">${esc(name)}</span>` +
    `<span class="st running">运行中</span><span class="dur"></span></div><div class="t-detail"></div>`;
  el.querySelector(".t-head").onclick = () => el.classList.toggle("open");
  container.appendChild(el);
  scrollBottom();
  return {
    done(status, content, input) {
      const dur = ((performance.now() - t0) / 1000).toFixed(1) + "s";
      const st = el.querySelector(".st");
      st.className = "st " + (status === "completed" ? "completed" : "error");
      st.textContent = status === "completed" ? "完成" : "失败";
      el.querySelector(".dur").textContent = dur;
      const detail = el.querySelector(".t-detail");
      if (input && Object.keys(input).length) {
        detail.innerHTML = `<div class="lbl">输入</div><pre>${esc(JSON.stringify(input, null, 2))}</pre>`;
        if (content !== undefined && content !== null && String(content).length) {
          detail.innerHTML += `<div class="lbl">输出</div><pre>${esc(String(content).slice(0, 4000))}</pre>`;
        }
      } else if (content) {
        detail.innerHTML = `<div class="lbl">输出</div><pre>${esc(String(content).slice(0, 4000))}</pre>`;
      }
      scrollBottom();
    },
  };
}

/* ═══════════ 计划卡片 ═══════════ */
const PLAN_GLYPH = { pending: "○", running: "◐", in_progress: "◐", completed: "●", failed: "×", blocked: "○" };
function makePlan(container, ev) {
  const el = document.createElement("div");
  el.className = "plan";
  el.innerHTML = `<div class="p-title">${esc(ev.title || "执行计划")}</div><div class="p-steps"></div>`;
  const steps = el.querySelector(".p-steps");
  for (const s of ev.steps || []) {
    const row = document.createElement("div");
    row.className = "p-step " + (s.status || "pending");
    row.dataset.key = s.step_key || "";
    row.innerHTML = `<span class="glyph">${PLAN_GLYPH[s.status] || "○"}</span><span>${esc(s.title || s.step_key || "")}</span>`;
    steps.appendChild(row);
  }
  container.appendChild(el);
  scrollBottom();
  return el;
}
function updatePlan(container, ev) {
  const plan = container.querySelector('.plan .p-step[data-key="' + CSS.escape(ev.step_key || "") + '"]');
  if (!plan) return;
  plan.className = "p-step " + (ev.status || "pending");
  plan.querySelector(".glyph").textContent = PLAN_GLYPH[ev.status] || "○";
  if (ev.status === "completed") plan.classList.add("done");
  if (ev.status === "in_progress" || ev.status === "running") plan.classList.add("doing");
}

/* ═══════════ 权限卡片 ═══════════ */
let pendingAskCard = null;
function makePerm(turn, ev) {
  const el = document.createElement("div");
  el.className = "perm";
  el.innerHTML = `<div class="p-head"><span class="badge">APPROVAL</span><span class="t">${esc(ev.tool_name || "工具")}</span></div>` +
    `<div class="reason">${esc(ev.reason || "")}</div>` +
    `<pre>${esc(JSON.stringify(ev.tool_input || {}, null, 2))}</pre>` +
    `<div class="p-actions"><button class="btn-ok" data-act="ok">批准 <kbd>Y</kbd></button>` +
    `<button class="btn-no" data-act="no">拒绝 <kbd>N</kbd></button></div>`;
  const act = (approved) => {
    api.post("/api/permission/respond", { session_id: curSession, ask_id: ev.ask_id, approved })
      .catch(e => console.warn("respond failed", e));
  };
  el.querySelector('[data-act="ok"]').onclick = () => act(true);
  el.querySelector('[data-act="no"]').onclick = () => act(false);
  turn.activity.appendChild(el);
  pendingAskCard = el;
  scrollBottom();
  return el;
}
document.addEventListener("keydown", (e) => {
  if (!pendingAskCard || e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  if (e.key === "y" || e.key === "Y") pendingAskCard.querySelector('[data-act="ok"]').click();
  if (e.key === "n" || e.key === "N") pendingAskCard.querySelector('[data-act="no"]').click();
});

/* ═══════════ 产物 ═══════════ */
function fileUrl(ev) {
  const u = ev.download_url || ev.filepath || "";
  if (/^https?:/.test(u)) return u;
  return "/api/file?session_id=" + encodeURIComponent(curSession) + "&path=" + encodeURIComponent(u);
}
const IMG_EXT = /\.(png|jpe?g|gif|webp|bmp)$/i;
function makeArtifact(turn, ev) {
  const url = fileUrl(ev);
  const name = ev.filename || ev.file_name || "artifact";
  if (IMG_EXT.test(name)) {
    const img = document.createElement("img");
    img.className = "artifact-img";
    img.src = url;
    img.alt = name;
    img.title = name + "（点击放大）";
    img.onclick = () => window.open(url, "_blank");
    turn.activity.appendChild(img);
  } else {
    const a = document.createElement("a");
    a.className = "artifact";
    a.href = url;
    a.download = name;
    const sz = ev.size ? `<span class="sz">${(ev.size / 1024).toFixed(1)} KB</span>` : "";
    a.innerHTML = `<span>▤</span><span>${esc(name)}</span>${sz}`;
    turn.activity.appendChild(a);
  }
  scrollBottom();
}

/* ═══════════ 发送 / SSE ═══════════ */
function setRunning(on) {
  running = on;
  $("#send").textContent = on ? "■" : "↑";
  $("#send").className = on ? "stop" : "";
  $("#send").id = "send";
  setStatus(on ? "运行中" : "空闲", on ? "running" : "");
  if (on) { $("#hd-dot").className = "dot running"; } 
}
$("#input").addEventListener("input", function () {
  this.style.height = "auto"; this.style.height = Math.min(this.scrollHeight, 200) + "px";
});
$("#input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("#send").onclick = () => (running ? api.post("/api/chat/abort", { session_id: curSession }) : send());
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && running) api.post("/api/chat/abort", { session_id: curSession });
});
document.querySelectorAll(".sug").forEach(el => {
  el.onclick = () => { $("#input").value = el.dataset.p; $("#input").dispatchEvent(new Event("input")); $("#input").focus(); };
});

async function send() {
  const text = $("#input").value.trim();
  if (!text || running) return;
  if (!curSession) await newSession();
  $("#input").value = ""; $("#input").style.height = "auto";
  hideEmpty();
  const userTurn = newTurn("user");
  userTurn.body.innerHTML = md(text);
  const turn = newTurn("assistant");
  const bodyEl = turn.body;
  let answer = "";
  stick = true;
  setRunning(true);
  totalTok = 0;

  let think = null, caret = null;
  const tools = new Map();

  const showCaret = () => {
    if (!caret) { caret = document.createElement("span"); caret.className = "caret"; bodyEl.appendChild(caret); }
  };
  const dropCaret = () => { if (caret) { caret.remove(); caret = null; } };
  const setText = () => {
    dropCaret();
    bodyEl.innerHTML = md(answer);
    showCaret();
  };

  try {
    const resp = await fetch("/api/chat", {
      method: "POST", headers: api.headers(),
      body: JSON.stringify({ session_id: curSession, message: text }),
    });
    if (resp.status === 401) { showGate("token 无效"); return; }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
        const line = chunk.split("\n").find(l => l.startsWith("data: "));
        if (!line) continue;
        let ev; try { ev = JSON.parse(line.slice(6)); } catch { continue; }
        handle(ev);
      }
    }
  } catch (e) {
    dropCaret();
    const el = document.createElement("div");
    el.className = "errblk";
    el.innerHTML = `<div class="e-head">CONNECTION</div>${esc("连接中断：" + e.message)}`;
    turn.activity.appendChild(el);
  } finally {
    dropCaret();
    setRunning(false);
  }

  function handle(ev) {
    const t = ev.type || "";
    if (t === "answer_delta") {
      answer += ev.content || "";
      setText();
      scrollBottom();
    }
    else if (t === "final_text") {
      if (!answer && ev.content) { answer = ev.content; setText(); scrollBottom(); }
      else { dropCaret(); }
    }
    else if (t === "thought_delta") {
      if (!think) think = makeThink(turn.activity);
      think.push(ev.content || "");
    }
    else if (t === "answer_start" || t === "llm_step_start") {
      if (think) think.collapse();
      if (t === "llm_step_start" && ev.iteration > 1) {
        const line = document.createElement("div");
        line.className = "step-line";
        line.textContent = `── step ${ev.iteration}${ev.model ? " · " + ev.model : ""} ──`;
        turn.activity.appendChild(line);
      }
    }
    else if (t === "llm_step_end") { if (think) think.collapse(); }
    else if (t === "action_start" || t === "action_end") {
      const id = ev.call_id || (ev.tool_name + "@" + (ev.step_key || ""));
      let row = tools.get(id);
      if (!row) { row = makeTool(turn.activity, ev.tool_name || "tool"); tools.set(id, row); }
      if (t === "action_end") {
        let parsedInput = null;
        try { parsedInput = typeof ev.tool_input === "string" ? JSON.parse(ev.tool_input) : ev.tool_input; } catch {}
        row.done(ev.status, ev.content, parsedInput);
      }
    }
    else if (t === "workflow_plan") makePlan(turn.activity, ev);
    else if (t === "workflow_step") updatePlan(turn.activity, ev);
    else if (t === "permission_ask") makePerm(turn, ev);
    else if (t === "permission_resolved") {
      if (pendingAskCard) {
        pendingAskCard.classList.add("resolved");
        const mark = document.createElement("div");
        mark.className = "resolved-mark";
        mark.innerHTML = ev.approved ? '<span style="color:var(--ok)">已批准</span>' : '<span style="color:var(--err)">已拒绝</span>';
        pendingAskCard.querySelector(".p-actions").remove();
        pendingAskCard.appendChild(mark);
        pendingAskCard = null;
      }
    }
    else if (t === "file_generated" || t === "image_generated") makeArtifact(turn, ev);
    else if (t === "token_usage") {
      totalTok = ev.total_tokens ?? totalTok;
      $("#tok").textContent = totalTok ? totalTok.toLocaleString() + " tok" : "";
    }
    else if (t === "llm_token_error") {
      dropCaret();
      const el = document.createElement("div");
      el.className = "errblk";
      el.innerHTML = `<div class="e-head">LLM ACCOUNT</div>模型服务 Token 余额不足，请充值后重试。`;
      turn.activity.appendChild(el);
    }
    else if (t === "error") {
      dropCaret();
      const el = document.createElement("div");
      el.className = "errblk";
      el.innerHTML = `<div class="e-head">ERROR</div>${esc(ev.content || "未知错误")}`;
      turn.activity.appendChild(el);
      scrollBottom();
    }
  }
}

/* ═══════════ 登录 & 启动 ═══════════ */
function showGate(err) {
  $("#gate").style.display = "grid";
  if (err) $("#gate-err").textContent = err;
}
$("#gate-enter").onclick = enterGate;
$("#gate-token").addEventListener("keydown", e => { if (e.key === "Enter") enterGate(); });
$("#btn-new").onclick = newSession;

async function enterGate() {
  const tk = $("#gate-token").value.trim();
  if (!tk) return;
  api.token = tk;
  try {
    await api.get("/api/health");
    localStorage.setItem("fm_token", tk);
    $("#gate").style.display = "none";
    await loadSessions();
  } catch (e) {
    if (e.message !== "unauthorized") showGate("连接失败：" + e.message);
  }
}

(async function init() {
  const urlToken = new URLSearchParams(location.search).get("token");
  if (urlToken) {
    api.token = urlToken;
    localStorage.setItem("fm_token", urlToken);
    history.replaceState(null, "", location.pathname);
  }
  try {
    const health = await fetch("/api/health").then(r => r.json());
    if (health && health.auth_required === false) {
      await loadSessions();
      $("#input").focus();
      return;
    }
  } catch (e) { /* 服务未就绪 */ }
  if (api.token) {
    try { await api.get("/api/health"); await loadSessions(); $("#input").focus(); return; }
    catch (e) { /* token 失效 */ }
  }
  $("#gate").style.display = "grid";
})();
</script>
